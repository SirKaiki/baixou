# Mantém as ações do workflow atualizadas (e avisa de falhas de segurança nelas).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # O wrangler (usado só para publicar o contador) fica com versão travada; o Dependabot propõe as atualizações.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
