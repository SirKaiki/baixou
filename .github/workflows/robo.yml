name: Robô de ofertas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # a cada 15 minutos, fora da virada da hora (o GitHub atrasa menos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "robo/**", "config.json", ".github/workflows/**"]

# Menor privilégio: por padrão o robô só lê. Cada trabalho pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write   # salvar os dados no repositório
      pages: write      # configure-pages
    outputs:
      freio: ${{ steps.robo.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Testes do guardião
        run: python -m unittest discover -s robo

      - name: Rodar o robô
        id: robo
        continue-on-error: true
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_MATT_WORD: ${{ vars.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ vars.ML_MATT_TOOL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python robo/robo.py

      - name: Canal de ofertas no Telegram (só liga com os segredos)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL_URL: ${{ vars.TELEGRAM_CANAL_URL }}
          WHATSAPP_CANAL_URL: ${{ vars.WHATSAPP_CANAL_URL }}
        run: python robo/telegram.py

      - name: Salvar os dados no repositório
        run: |
          git config user.name "baixou-robo"
          git config user.email "baixou-robo@users.noreply.github.com"
          git add site/data dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -q -m "dados: atualização automática"
            git pull -q --rebase origin main && git push -q
          fi

      - name: Gerar páginas de compartilhamento e sitemap (só no pacote publicado)
        run: python robo/paginas.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Forçar o navegador a baixar a versão nova do site
        run: sed -i "s/app\.css\"/app.css?v=${GITHUB_SHA::7}\"/; s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/" site/index.html && grep -o 'app\.[a-z]*?v=[0-9a-f]*' site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  publicar:
    needs: robo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publicar o site
      id-token: write   # prova de origem exigida pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Avisar se o freio foi acionado
        if: needs.robo.outputs.freio == 'failure'
        run: |
          echo "::error::O robô acionou o freio de emergência ou falhou. Veja o painel (painel.html) para detalhes."
          exit 1
