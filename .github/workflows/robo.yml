name: Robô de ofertas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # a cada 15 minutos, fora da virada da hora (o GitHub atrasa menos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "robo/**", "config.json", ".github/workflows/**"]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      freio: ${{ steps.robo.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do guardião
        run: python -m unittest discover -s robo

      - name: Rodar o robô
        id: robo
        continue-on-error: true
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_MATT_WORD: ${{ vars.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ vars.ML_MATT_TOOL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python robo/robo.py

      - name: Salvar os dados no repositório
        run: |
          git config user.name "baixou-robo"
          git config user.email "baixou-robo@users.noreply.github.com"
          git add site/data dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -q -m "dados: atualização automática"
            git pull -q --rebase origin main && git push -q
          fi

      - name: Gerar páginas de compartilhamento e sitemap (só no pacote publicado)
        run: python robo/paginas.py

      - uses: actions/configure-pages@v5

      - name: Forçar o navegador a baixar a versão nova do site
        run: sed -i "s/app\.css\"/app.css?v=${GITHUB_SHA::7}\"/; s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/" site/index.html && grep -o 'app\.[a-z]*?v=[0-9a-f]*' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: robo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar se o freio foi acionado
        if: needs.robo.outputs.freio == 'failure'
        run: |
          echo "::error::O robô acionou o freio de emergência ou falhou. Veja o painel (painel.html) para detalhes."
          exit 1
